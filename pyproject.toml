[project]
name = "intro-bayes-2026"
version = "0.1.0"
authors = [
    { name = "Tomás Capretto", email = "tomicapretto@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arviz>=1.3.0",
    "bambi",
    "black[jupyter]>=26.10.1",
    "graphviz>=0.21",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "nutpie>=0.16.11",
    "polars>=2.1.0",
    "preliz>=0.28.0",
    "pymc>=6.3.2",
    "pyprojroot>=0.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
bambi = { git = "https://github.com/bambinos/bambi.git", rev = "dev" }
